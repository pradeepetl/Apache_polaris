server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve container names so restarted containers (new IP) don't cause 502s
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $polaris_api http://polaris:8181;
        proxy_pass $polaris_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /polaris-mgmt/ {
        set $polaris_mgmt http://polaris:8182;
        rewrite ^/polaris-mgmt/(.*)$ /$1 break;
        proxy_pass $polaris_mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /manage/ {
        set $manager http://polaris-manager:8000;
        rewrite ^/manage/(.*)$ /$1 break;
        proxy_pass $manager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    location /jaeger/ {
        set $jaeger http://jaeger:16686;
        rewrite ^/jaeger/(.*)$ /$1 break;
        proxy_pass $jaeger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /trino/ {
        set $trino https://trino:8443;
        rewrite ^/trino/(.*)$ /$1 break;
        proxy_pass $trino;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "close";
        proxy_hide_header WWW-Authenticate;
        proxy_connect_timeout 5s;
    }
}
